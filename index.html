<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Willow's Social</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Nunito+Sans:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
:root{--banner-h:180px}
@media (max-width:640px){:root{--banner-h:140px}}
body{font-family:var(--font-body);color:var(--text);background:var(--bg-base);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.modal-open,body.admin-open{overflow:hidden}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.top{position:relative;z-index:2}
.promo{background:var(--promo-bg);color:var(--promo-text);text-align:center;font-weight:800;font-size:14px;letter-spacing:.05em;padding:9px 16px;text-transform:uppercase}
.promo[hidden]{display:none}
.banner-wrap{position:relative;height:var(--banner-h);overflow:hidden;border-bottom:2px solid var(--accent);box-shadow:0 6px 30px var(--glow)}
.banner{position:absolute;inset:0;overflow:hidden}
.title{position:absolute;left:0;right:0;top:12px;text-align:center;font-family:var(--font-display);font-weight:700;font-size:clamp(26px,5vw,44px);color:var(--title-color);text-shadow:var(--title-shadow);z-index:4;padding:0 16px;pointer-events:none;line-height:1.1}
.wrap{position:relative;z-index:2;max-width:520px;margin:0 auto;padding:0 16px 36px;display:flex;flex-direction:column;align-items:center}
.avatar{width:112px;height:112px;border-radius:50%;margin-top:-56px;border:3px solid var(--accent);background:var(--avatar-bg);box-shadow:0 0 30px var(--glow);overflow:hidden;display:grid;place-items:center;position:relative;z-index:4}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar .glyph{font-size:50px;color:var(--accent);line-height:1}
.tagline{margin-top:14px;text-align:center;color:var(--muted);font-size:16px;line-height:1.5;white-space:pre-line}
.tagline[hidden]{display:none}
.buttons{width:100%;display:flex;flex-direction:column;gap:14px;margin-top:26px}
.card{position:relative;width:100%;height:104px;border:1px solid var(--card-border);border-radius:18px;overflow:hidden;cursor:pointer;background:var(--card-empty);color:var(--card-text,#fff);font:inherit;text-align:left;display:flex;align-items:center;padding:0 22px;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.35),0 0 24px var(--glow)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.card-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%}
.card-shade{position:absolute;inset:0;background:var(--card-shade)}
.card-glyph{position:absolute;right:64px;top:50%;transform:translateY(-50%);font-size:76px;color:var(--accent);opacity:.2;line-height:1}
.card-label{position:relative;font-family:var(--font-display);font-weight:700;font-size:24px;letter-spacing:.02em;text-shadow:var(--card-text-shadow,0 2px 8px rgba(0,0,0,.7));flex:1}
.card.has-photo{color:#fff}
.card.has-photo .card-label{text-shadow:0 2px 8px rgba(0,0,0,.7)}
.card-arrow{position:relative;font-size:34px;color:var(--accent);line-height:1}
@media (min-width:641px){.card{height:116px}}
.foot{position:relative;z-index:2;text-align:center;padding:0 16px 32px;display:flex;flex-direction:column;align-items:center;gap:14px}
.credit{color:var(--muted);font-size:14px;text-decoration:none;border-bottom:1px dashed var(--card-border);padding-bottom:2px}
.credit:hover{color:var(--accent);border-color:var(--accent)}
.credit[hidden]{display:none}
.admin-link{background:rgba(0,0,0,.25);border:1px solid var(--card-border);color:var(--muted);font:inherit;font-size:13px;font-weight:700;letter-spacing:.05em;padding:9px 18px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:color .2s,border-color .2s}
.admin-link:hover{color:var(--accent);border-color:var(--accent)}
.admin-link:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.admin-link svg{width:13px;height:13px}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.modal-backdrop{position:absolute;inset:0;background:rgba(5,2,10,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;transition:opacity .25s}
.sheet{position:relative;width:100%;max-width:460px;max-height:90vh;overflow:auto;background:var(--sheet-bg);border:1px solid var(--card-border);border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 40px var(--glow);transform:translateY(24px);opacity:0;transition:transform .25s,opacity .25s}
.modal.open .modal-backdrop{opacity:1}
.modal.open .sheet{transform:none;opacity:1}
.sheet-close{position:absolute;top:10px;right:10px;width:42px;height:42px;border-radius:50%;border:none;background:rgba(0,0,0,.4);color:#fff;font-size:28px;line-height:1;cursor:pointer;z-index:2}
.sheet-close:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sheet-body{padding:24px 20px 26px}
.sheet-pic{display:block;width:132px;height:132px;border-radius:50%;object-fit:cover;object-position:center 25%;margin:6px auto 16px;border:3px solid var(--accent);box-shadow:0 0 28px var(--glow)}
.sheet-pic[hidden]{display:none}
.sheet-pic:not([hidden])+.sheet-title{text-align:center;padding:0 44px}
.sheet-title{font-family:var(--font-display);font-weight:700;font-size:30px;color:var(--accent);margin-bottom:14px;padding-right:44px}
.sheet-note{font-size:17px;line-height:1.55;white-space:pre-line;margin-bottom:18px;background:var(--note-bg);border-left:3px solid var(--accent);padding:12px 14px;border-radius:10px}
.sheet-note[hidden]{display:none}
.sheet-links{display:flex;flex-direction:column;gap:12px}
.promo-box{position:relative;text-align:center;border-radius:16px;padding:16px 14px 14px;margin-bottom:16px;background:var(--link-bg);color:var(--link-text);box-shadow:0 8px 24px rgba(0,0,0,.3),0 0 26px var(--glow);overflow:hidden}
.promo-box[hidden]{display:none}
.promo-box::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
.promo-kicker{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.promo-big{font-family:var(--font-display);font-weight:700;font-size:28px;line-height:1.1;margin:4px 0 8px}
.promo-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.promo-chips span{font-size:13px;font-weight:800;background:rgba(0,0,0,.14);padding:5px 10px;border-radius:999px}
@media (prefers-reduced-motion:reduce){.promo-box::after{animation:none;display:none}}
.meter{background:var(--note-bg);border:1px solid var(--card-border);border-radius:16px;padding:16px;margin-bottom:18px}
.meter[hidden]{display:none}
.meter-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.meter-top span{font-size:14px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.meter-top i{font-style:normal}
.meter-top strong{font-family:var(--font-display);font-size:32px;color:var(--accent);line-height:1}
.meter-top small{font-size:15px;color:var(--muted);font-family:var(--font-body);font-weight:700}
.meter-bar{height:14px;border-radius:999px;background:rgba(0,0,0,.35);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
.meter-bar span{display:block;height:100%;width:0;border-radius:999px;background:var(--link-bg);box-shadow:0 0 12px var(--accent);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.meter-text{margin-top:10px;font-size:16px;line-height:1.45}
.meter-text b{color:var(--accent)}
.meter-sub{margin-top:4px;font-size:13px;color:var(--muted)}
.big-link{display:block;width:100%;border:none;cursor:pointer;font-family:inherit;text-align:center;text-decoration:none;font-weight:800;font-size:19px;padding:18px 16px;border-radius:14px;background:var(--link-bg);color:var(--link-text);box-shadow:0 6px 18px rgba(0,0,0,.35);transition:transform .15s,filter .15s}
.big-link:hover{transform:translateY(-1px);filter:brightness(1.08)}
.big-link:focus-visible{outline:2px solid #fff;outline-offset:3px}
.admin-form{display:flex;flex-direction:column;gap:10px}
.admin-label{font-size:14px;font-weight:700;color:var(--muted)}
.admin-form input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--card-border);background:var(--input-bg,rgba(0,0,0,.3));color:var(--text);font:inherit;font-size:17px}
.admin-form input:focus{outline:2px solid var(--accent);outline-offset:1px}
.admin-err{color:#ff9a9a;font-size:14px;min-height:1.3em}
@media (max-width:640px){.modal{align-items:flex-end;padding:0}.sheet{max-width:none;border-radius:22px 22px 0 0;max-height:88vh;padding-bottom:env(safe-area-inset-bottom);transform:translateY(100%)}}
@media (prefers-reduced-motion:reduce){.strip,.bg-pulse,.bg-glow,.twinkle,.bob,.walker *{animation:none!important}.sheet,.modal-backdrop,.card,.door{transition:none!important}}


:root{--font-display:'Cinzel',Georgia,serif;--font-body:'Nunito Sans',system-ui,sans-serif;--bg-base:#12051f;--text:#f6eefe;--muted:#dccbef;--accent:#e8bd62;--glow:rgba(176,92,255,.45);--promo-bg:linear-gradient(90deg,#b8862d,#f3d488,#b8862d);--promo-text:#2a0f3d;--title-color:#f6d98a;--title-shadow:0 2px 10px rgba(20,4,40,.95),0 0 22px rgba(232,189,98,.55);--avatar-bg:linear-gradient(135deg,#3f1468,#1d0833);--card-empty:linear-gradient(135deg,rgba(70,22,115,.32),rgba(25,7,45,.22));--card-border:rgba(232,189,98,.55);--card-shade:linear-gradient(90deg,rgba(18,5,31,.85) 0%,rgba(18,5,31,.4) 55%,rgba(18,5,31,.08) 100%);--sheet-bg:linear-gradient(180deg,#28093f,#16052a);--note-bg:rgba(232,189,98,.10);--link-bg:linear-gradient(135deg,#f6dc95,#c9952f);--link-text:#2a0f3d}
.bg-base{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,#3b1166 0%,#1e0738 45%,#0b0215 100%)}
.bg-pulse{position:absolute;left:50%;top:58%;width:140vmax;height:140vmax;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(180,95,255,.6) 0%,rgba(126,34,206,.25) 32%,transparent 62%);animation:pulse 6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35;transform:translate(-50%,-50%) scale(.88)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}}
.sym{position:absolute;opacity:0;filter:drop-shadow(0 0 8px rgba(255,210,120,.95)) drop-shadow(0 0 26px rgba(232,189,98,.65));animation:symfade 7s ease-in-out forwards}
.sym svg{display:block;width:100%;height:auto}
@keyframes symfade{0%{opacity:0;transform:scale(.9)}22%{opacity:.95;transform:scale(1)}40%{opacity:.55}58%{opacity:.95}100%{opacity:0;transform:scale(1.05)}}
.banner{background:linear-gradient(180deg,#160630 0%,#46186b 42%,#a4506c 76%,#e8a65c 100%)}
.sky{position:absolute;inset:0;width:100%;height:100%}
.strip{position:absolute;left:0;bottom:0;height:100%;display:flex;width:max-content;animation:slide linear infinite;will-change:transform}
.strip svg{height:100%;width:auto;flex:none;display:block}
.strip.far{animation-duration:150s}
.strip.near{animation-duration:75s}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.twinkle{animation:tw 3.5s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.9}50%{opacity:.25}}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(1.5px)}}
</style>
</head>

<script>
const DEFAULT_CONFIG={"title": "Willow's Social", "tagline": "", "profilePhoto": "", "promo": {"text": "50% off customs for subscribers", "show": false}, "meter": {"show": true, "buttonId": "onlyfans", "subs": 0, "startPrice": 15, "step": 50, "floorPrice": 5}, "ofPromo": {"show": false, "buttonId": "onlyfans", "type": "trial", "spots": 5, "trialDays": 7, "discount": 50, "expireDays": 7, "expiresAt": 0}, "credit": {"text": "Want a page like this? Get yours here", "url": "", "show": false}, "profilePhotoPos": 30, "buttons": [{"id": "socials", "label": "Socials", "photo": "", "note": "", "visible": true, "links": [{"label": "TikTok", "url": "https://www.tiktok.com/@willowsrealm77"}, {"label": "Clapper", "url": ""}]}, {"id": "onlyfans", "label": "OnlyFans", "photo": "", "note": "50% off customs for subscribers\nAvailable this weekend only", "visible": true, "links": [{"label": "OnlyFans", "url": ""}]}, {"id": "clips4sale", "label": "Clips4Sale", "photo": "", "note": "", "visible": true, "links": [{"label": "Clips4Sale", "url": ""}]}, {"id": "tips", "label": "Tip Me", "photo": "", "note": "", "visible": true, "links": [{"label": "Cash App", "url": ""}, {"label": "Venmo", "url": ""}]}, {"id": "customs", "label": "Customs", "photo": "", "note": "", "visible": true, "links": []}]};
const GLYPH="☥";
const SITE_KEY="willow";

function sha256(str){
  const K=[],H=[];let n=2,c=0;const frac=x=>((x-Math.floor(x))*4294967296)|0;
  while(c<64){let p=true;for(let d=2;d*d<=n;d++)if(n%d===0){p=false;break;}if(p){if(c<8)H[c]=frac(Math.pow(n,1/2));K[c]=frac(Math.pow(n,1/3));c++;}n++;}
  const b=new TextEncoder().encode(str),l=b.length,total=Math.ceil((l+9)/64)*64,m=new Uint8Array(total);m.set(b);m[l]=0x80;
  const dv=new DataView(m.buffer),bits=l*8;dv.setUint32(total-8,Math.floor(bits/4294967296));dv.setUint32(total-4,bits>>>0);
  const w=new Int32Array(64);let h=H.slice();
  for(let i=0;i<total;i+=64){
    for(let t=0;t<16;t++)w[t]=dv.getInt32(i+t*4);
    for(let t=16;t<64;t++){const a=w[t-15],d=w[t-2];const s0=(a>>>7|a<<25)^(a>>>18|a<<14)^(a>>>3);const s1=(d>>>17|d<<15)^(d>>>19|d<<13)^(d>>>10);w[t]=(w[t-16]+s0+w[t-7]+s1)|0;}
    let [A,B,C,D,E,F,G,X]=h;
    for(let t=0;t<64;t++){const S1=(E>>>6|E<<26)^(E>>>11|E<<21)^(E>>>25|E<<7);const ch=(E&F)^(~E&G);const t1=(X+S1+ch+K[t]+w[t])|0;
      const S0=(A>>>2|A<<30)^(A>>>13|A<<19)^(A>>>22|A<<10);const mj=(A&B)^(A&C)^(B&C);const t2=(S0+mj)|0;X=G;G=F;F=E;E=(D+t1)|0;D=C;C=B;B=A;A=(t1+t2)|0;}
    h=[h[0]+A,h[1]+B,h[2]+C,h[3]+D,h[4]+E,h[5]+F,h[6]+G,h[7]+X].map(v=>v|0);
  }
  return h.map(v=>(v>>>0).toString(16).padStart(8,'0')).join('');
}


function safeUrl(u){u=(u||'').trim();if(!u)return '';if(/^(https?:|mailto:|tel:|sms:)/i.test(u))return u;if(/^[a-z][a-z0-9+.-]*:/i.test(u))return '';return 'https://'+u;}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
let CFG=DEFAULT_CONFIG;
function posOf(v){v=Number(v);return isFinite(v)?Math.min(100,Math.max(0,v)):30;}
function money(n){return '$'+(Math.round(n*100)%100?n.toFixed(2):String(Math.round(n)));}
function promoInfo(p){
  if(!p||!p.show)return null;
  const now=Date.now(),exp=Number(p.expiresAt)||0;
  if(exp&&now>=exp)return null;
  const big=p.type==='discount'?(Number(p.discount)||0)+'% OFF your first month':'FREE '+(Number(p.trialDays)||1)+'-day trial';
  const chips=[];const n=Math.floor(Number(p.spots)||0);
  if(n>0)chips.push('Only '+n+' spot'+(n===1?'':'s'));
  if(exp){const ms=exp-now,d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),mi=Math.max(1,Math.floor(ms%36e5/6e4));
    const D=d>=3?Math.ceil(ms/864e5):d;chips.push('Ends in '+(d>=1?D+' day'+(D===1?'':'s')+(d<3&&h?' '+h+'h':''):h>=1?h+'h '+mi+'m':mi+' min'));}
  return {big,chips};
}
function meterInfo(m){
  const subs=Math.max(0,Math.floor(Number(m.subs)||0)),step=Math.max(1,Math.floor(Number(m.step)||50));
  const start=Number(m.startPrice)||15,low=Math.max(0,Number(m.floorPrice)||0);
  let price=start-Math.floor(subs/step);if(price<low)price=low;
  const done=price-1<low,into=subs%step;
  return {subs,step,price,next:price-1,into,left:step-into,done};
}
async function loadConfig(){try{const r=await fetch('config.json',{cache:'no-cache'});if(r.ok){const j=await r.json();if(j&&Array.isArray(j.buttons))return j;}}catch(e){}return DEFAULT_CONFIG;}
function render(cfg){
  CFG=cfg;
  if(cfg.title)document.title=cfg.title;
  document.getElementById('title').textContent=cfg.title||'';
  const promo=document.getElementById('promo');
  if(cfg.promo&&cfg.promo.show&&cfg.promo.text){promo.textContent=cfg.promo.text;promo.hidden=false;}else promo.hidden=true;
  const av=document.getElementById('avatar');av.innerHTML='';
  if(cfg.profilePhoto){const img=el('img');img.src=cfg.profilePhoto;img.alt=cfg.title||'';img.style.objectPosition='center '+posOf(cfg.profilePhotoPos)+'%';av.appendChild(img);}else av.appendChild(el('span','glyph',GLYPH));
  const cr=document.getElementById('credit'),cu=safeUrl(cfg.credit&&cfg.credit.url);
  if(cfg.credit&&cfg.credit.show&&cfg.credit.text&&cu){cr.textContent=cfg.credit.text;cr.href=cu;if(/^https?:/i.test(cu)){cr.target='_blank';cr.rel='noopener';}cr.hidden=false;}else cr.hidden=true;
  const tg=document.getElementById('tagline');tg.textContent=cfg.tagline||'';tg.hidden=!cfg.tagline;
  const nav=document.getElementById('buttons');nav.innerHTML='';
  (cfg.buttons||[]).filter(b=>b.visible!==false).forEach(b=>{
    const btn=el('button','card'+(b.photo?' has-photo':''));btn.type='button';
    if(b.photo){const img=el('img','card-img');img.src=b.photo;img.alt='';img.loading='lazy';img.style.objectPosition='center '+posOf(b.photoPos)+'%';btn.appendChild(img);btn.appendChild(el('span','card-shade'));}
    else btn.appendChild(el('span','card-glyph',GLYPH));
    btn.appendChild(el('span','card-label',b.label||''));
    const ar=el('span','card-arrow','›');ar.setAttribute('aria-hidden','true');btn.appendChild(ar);
    btn.addEventListener('click',()=>openButton(b,btn));
    nav.appendChild(btn);
  });
}
let lastFocus=null,openM=null;
function showModal(m,opener,focusEl){
  lastFocus=opener;openM=m;m.hidden=false;document.body.classList.add('modal-open');
  requestAnimationFrame(()=>requestAnimationFrame(()=>m.classList.add('open')));
  (focusEl||m.querySelector('.sheet-close')).focus();
}
function closeModal(){
  const m=openM;if(!m)return;openM=null;
  m.classList.remove('open');document.body.classList.remove('modal-open');
  setTimeout(()=>{if(!m.classList.contains('open'))m.hidden=true;},260);
  if(lastFocus)lastFocus.focus();
}
function openButton(b,opener){
  const m=document.getElementById('modal');
  const pic=m.querySelector('.sheet-pic');if(b.photo){pic.src=b.photo;pic.style.objectPosition='center '+posOf(b.photoPos)+'%';pic.hidden=false;}else{pic.removeAttribute('src');pic.hidden=true;}
  const pb=m.querySelector('.promo-box'),pr=CFG.ofPromo,pi=promoInfo(pr);
  if(pi&&b.id===pr.buttonId){
    pb.querySelector('.promo-big').textContent=pi.big;const ch=pb.querySelector('.promo-chips');ch.innerHTML='';
    pi.chips.forEach(c=>ch.appendChild(el('span',null,c)));pb.hidden=false;
  }else pb.hidden=true;
  const mt=m.querySelector('.meter'),mc=CFG.meter;
  if(mc&&mc.show&&b.id===mc.buttonId){
    const x=meterInfo(mc),bar=mt.querySelector('.meter-bar'),fill=bar.querySelector('span');
    mt.querySelector('.m-price').textContent=money(x.price);
    const t=mt.querySelector('.meter-text');t.textContent='';
    if(x.done){t.append('You unlocked my lowest price! \u2728');fill.dataset.w=100;}
    else{const b1=el('b',null,String(x.into)),b2=el('b',null,money(x.next));t.append(b1,' of '+x.step+' new subscribers until my price drops to ',b2);fill.dataset.w=x.into/x.step*100;}
    mt.querySelector('.meter-sub').textContent=x.done?'':'Every '+x.step+' subscribers drops my price $1.';
    bar.setAttribute('aria-valuemax',x.step);bar.setAttribute('aria-valuenow',x.done?x.step:x.into);
    fill.style.width='0';mt.hidden=false;setTimeout(()=>{fill.style.width=fill.dataset.w+'%';},280);
  }else mt.hidden=true;
  m.querySelector('.sheet-title').textContent=b.label||'';
  const note=m.querySelector('.sheet-note');note.textContent=b.note||'';note.hidden=!b.note;
  const links=m.querySelector('.sheet-links');links.innerHTML='';
  (b.links||[]).forEach(l=>{const u=safeUrl(l.url);if(!u)return;const a=el('a','big-link',l.label||'Open');a.href=u;if(/^https?:/i.test(u)){a.target='_blank';a.rel='noopener';}links.appendChild(a);});
  showModal(m,opener);
}
document.querySelectorAll('[data-close]').forEach(x=>x.addEventListener('click',closeModal));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
const UNLOCK_KEY='hubUnlocked:'+SITE_KEY;
document.getElementById('adminLink').addEventListener('click',e=>{
  if(!CFG.adminPasswordHash){window.openAdmin();return;}
  document.getElementById('adminErr').textContent='';const pw=document.getElementById('adminPw');pw.value='';
  showModal(document.getElementById('adminModal'),e.currentTarget,pw);
});
document.getElementById('adminForm').addEventListener('submit',e=>{
  e.preventDefault();const pw=document.getElementById('adminPw');
  if(sha256('hubAdmin:'+SITE_KEY+':'+pw.value)===CFG.adminPasswordHash){try{sessionStorage.setItem(UNLOCK_KEY,CFG.adminPasswordHash);}catch(x){}closeModal();window.openAdmin();}
  else{document.getElementById('adminErr').textContent='Wrong password. Try again.';pw.select();}
});
render(DEFAULT_CONFIG);
loadConfig().then(c=>{if(c!==DEFAULT_CONFIG)render(c);});


(function(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const SYMS=["<svg viewBox=\"0 0 60 100\"><g fill=\"none\" stroke=\"url(#gold)\" stroke-width=\"7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M30 40 C15 30 16 6 30 6 C44 6 45 30 30 40 Z\"/><path d=\"M8 45 H52\"/><path d=\"M30 41 V94\"/></g></svg>", "<svg viewBox=\"0 0 60 130\"><path d=\"M30 3C19 3 12 12 12 25c0 9 2 13-2 21-4 10-3 24 1 42 3 16 7 30 11 38h16c4-8 8-22 11-38 4-18 5-32 1-42-4-8-2-12-2-21C48 12 41 3 30 3z\" fill=\"url(#gold)\" fill-opacity=\".22\" stroke=\"url(#gold)\" stroke-width=\"2.5\"/><ellipse cx=\"30\" cy=\"25\" rx=\"8\" ry=\"10\" fill=\"url(#gold)\" fill-opacity=\".55\"/><g fill=\"none\" stroke=\"url(#gold)\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M15 20 L13 42 M45 20 L47 42 M18 14 L16 38 M42 14 L44 38\"/><path d=\"M26 23 H28 M32 23 H34\"/><path d=\"M14 47 Q30 60 46 47 M13 53 Q30 68 47 53\"/><path d=\"M18 68 L42 78 M42 68 L18 78\"/><path d=\"M15 90 H45 M18 104 H42 M21 117 H39 M30 82 V124\"/></g></svg>"];const bg=document.querySelector('.bg');let i=0;
  function spawn(){
    const d=document.createElement('div');d.className='sym';const isAnkh=i%2===0;d.innerHTML=SYMS[i%2];i++;
    const small=innerWidth<640;
    const w=isAnkh?(small?70:60)+Math.random()*30:(small?56:48)+Math.random()*24;

})();

<div id="adminApp" hidden>

</div>
<header><h1>Willow's Social <span>Admin</span></h1><div class="row"><button class="btn small ghost" type="button" id="closeAdmin">← Back to site</button><button class="btn small ghost" type="button" id="lockBtn">Lock</button></div></header>
<div class="awrap">

    </div>
    <label class="field"><span class="field-label">GitHub key (fine-grained token, Contents: read &amp; write)</span><input type="password" id="ghToken" autocomplete="off"></label>
    <div class="row"><button class="btn" type="button" id="connect">Save &amp; connect</button><button class="btn ghost small" type="button" id="forget">Forget key</button></div>
  </details></section>
  <div id="form"></div>
</div>
<div class="afooter"><div class="inner"><div id="status" role="status" aria-live="polite">Loading…</div><button class="btn" type="button" id="saveBtn">Save &amp; publish</button></div></div>
</div>
<script>
(function(){

const SITE={"key": "willow", "owner": "WillowsLoom", "repo": "willows-social-hub"};
const DEFAULT_CONFIG={"title": "Willow's Social", "tagline": "", "profilePhoto": "", "promo": {"text": "50% off customs for subscribers", "show": false}, "meter": {"show": true, "buttonId": "onlyfans", "subs": 0, "startPrice": 15, "step": 50, "floorPrice": 5}, "ofPromo": {"show": false, "buttonId": "onlyfans", "type": "trial", "spots": 5, "trialDays": 7, "discount": 50, "expireDays": 7, "expiresAt": 0}, "credit": {"text": "Want a page like this? Get yours here", "url": "", "show": false}, "profilePhotoPos": 30, "buttons": [{"id": "socials", "label": "Socials", "photo": "", "note": "", "visible": true, "links": [{"label": "TikTok", "url": "https://www.tiktok.com/@willowsrealm77"}, {"label": "Clapper", "url": ""}]}, {"id": "onlyfans", "label": "OnlyFans", "photo": "", "note": "50% off customs for subscribers\nAvailable this weekend only", "visible": true, "links": [{"label": "OnlyFans", "url": ""}]}, {"id": "clips4sale", "label": "Clips4Sale", "photo": "", "note": "", "visible": true, "links": [{"label": "Clips4Sale", "url": ""}]}, {"id": "tips", "label": "Tip Me", "photo": "", "note": "", "visible": true, "links": [{"label": "Cash App", "url": ""}, {"label": "Venmo", "url": ""}]}, {"id": "customs", "label": "Customs", "photo": "", "note": "", "visible": true, "links": []}]};
const HINTS={"onlyfans": "Deals for subscribers, e.g. 50% off customs", "tips": "A short note shown above your payment buttons", "customs": "What you offer, pricing, and how to request"};
const KEY='hubAdmin:'+SITE.key,UNLOCK='hubUnlocked:'+SITE.key;

function hashPw(p){return sha256('hubAdmin:'+SITE.key+':'+p);}
let cfg=null,dirty=false,gateDone=false,gateMode='login',gateHash='';const pending={},cache={};
function posOf(v){v=Number(v);return isFinite(v)?Math.min(100,Math.max(0,v)):30;}
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
function clone(o){return JSON.parse(JSON.stringify(o));}
function status(msg,kind){const s=document.getElementById('status');s.textContent=msg;s.className=kind||'';}
function sGet(k){try{return sessionStorage.getItem(k);}catch(e){return null;}}
function sSet(k,v){try{sessionStorage.setItem(k,v);}catch(e){}}
function loadGh(){let o={};try{o=JSON.parse(localStorage.getItem(KEY))||{};}catch(e){}return Object.assign({owner:SITE.owner,repo:SITE.repo,branch:'main',token:''},o);}
let gh=loadGh();
function api(path,opts){opts=opts||{};const q=opts.method?'':'?ref='+encodeURIComponent(gh.branch);
  return fetch('https://api.github.com/repos/'+encodeURIComponent(gh.owner)+'/'+encodeURIComponent(gh.repo)+'/contents/'+path+q,
   Object.assign({},opts,{headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+gh.token}}));}
async function errText(r){try{const j=await r.json();if(r.status===401)return 'GitHub key not accepted';if(r.status===404)return 'repo not found (check username/repo name and key access)';return j.message||('error '+r.status);}catch(e){return 'error '+r.status;}}
function enc(str){const b=new TextEncoder().encode(str);let s='';for(let i=0;i<b.length;i+=32768)s+=String.fromCharCode.apply(null,b.subarray(i,i+32768));return btoa(s);}
function dec(b64){const bin=atob(b64.replace(/\s/g,''));return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)));}
async function liveHash(){try{const r=await fetch('config.json',{cache:'no-cache'});if(r.ok){const j=await r.json();return j.adminPasswordHash||'';}}catch(e){}return '';}
function normalize(){
  cfg.title=cfg.title||'';cfg.tagline=cfg.tagline||'';cfg.profilePhoto=cfg.profilePhoto||'';
  cfg.promo=Object.assign({text:'',show:false},cfg.promo||{});
  cfg.profilePhotoPos=posOf(cfg.profilePhotoPos);
  if(cfg.live)cfg.live=Object.assign({show:true,days:[5,6,0],start:'17:00',hours:2,url:''},cfg.live);
  if(cfg.night)cfg.night=Object.assign({show:true,start:'21:00',end:'06:00'},cfg.night);
  if(cfg.ofPromo)cfg.ofPromo=Object.assign({show:false,buttonId:'onlyfans',type:'trial',spots:5,trialDays:7,discount:50,expireDays:7,expiresAt:0},cfg.ofPromo);
  if(cfg.meter)cfg.meter=Object.assign({show:true,buttonId:'onlyfans',subs:0,startPrice:15,step:50,floorPrice:5},cfg.meter);
  cfg.credit=Object.assign({text:'Want a page like this? Get yours here',url:'',show:false},cfg.credit||{});
  cfg.buttons=(cfg.buttons||[]).map((b,i)=>Object.assign({id:'btn'+Date.now()+i,label:'',photo:'',note:'',visible:true,links:[]},b));
  cfg.buttons.forEach(b=>{b.photoPos=posOf(b.photoPos);b.links=(b.links||[]).map(l=>({label:l.label||'',url:l.url||''}));});
}
async function load(){
  status('Loading…');
  if(gh.token){
    try{const r=await api('config.json');
      if(r.status===404){cfg=clone(DEFAULT_CONFIG);status('Connected. No saved settings yet, so these are the starting defaults.','warn');}
      else if(r.ok){const j=await r.json();cfg=JSON.parse(dec(j.content));status('Connected. Loaded your live settings.','ok');}
      else throw new Error(await errText(r));
    }catch(e){cfg=cfg||clone(DEFAULT_CONFIG);status('Couldn\'t load from GitHub: '+e.message,'err');document.getElementById('setup').open=true;}
  }else{
    try{const r=await fetch('config.json',{cache:'no-cache'});cfg=r.ok?await r.json():clone(DEFAULT_CONFIG);}catch(e){cfg=clone(DEFAULT_CONFIG);}
    status('Connect GitHub (top) so you can save.','warn');document.getElementById('setup').open=true;
  }
  normalize();dirty=false;render();await gate();
}
async function gate(){
  if(gateDone)return;
  gateHash=cfg.adminPasswordHash||await liveHash();
  const g=document.getElementById('gate');
  if(gateHash&&sGet(UNLOCK)===gateHash){g.hidden=true;gateDone=true;return;}
  g.hidden=false;document.getElementById('pw1').value='';document.getElementById('pw2').value='';document.getElementById('gateErr').textContent='';
  gateMode=gateHash?'login':'create';
  document.getElementById('gateMsg').textContent=gateMode==='login'?'Enter your password.':'First time here. Create a password for your admin portal.';
  document.getElementById('pw1Label').textContent=gateMode==='login'?'Password':'New password';
  document.getElementById('pw2Wrap').hidden=gateMode==='login';
  document.getElementById('gateBtn').textContent=gateMode==='login'?'Enter':'Create password';
  document.getElementById('gateForm').hidden=false;document.getElementById('pw1').focus();
}
document.getElementById('gateForm').addEventListener('submit',e=>{
  e.preventDefault();const p1=document.getElementById('pw1').value,p2=document.getElementById('pw2').value,err=document.getElementById('gateErr');
  if(gateMode==='login'){
    if(hashPw(p1)===gateHash){sSet(UNLOCK,gateHash);document.getElementById('gate').hidden=true;gateDone=true;}
    else{err.textContent='Wrong password. Try again.';document.getElementById('pw1').select();}
  }else{
    if(p1.length<4){err.textContent='Use at least 4 characters.';return;}
    if(p1!==p2){err.textContent='Those don\'t match.';return;}
    const h=hashPw(p1);cfg.adminPasswordHash=h;sSet(UNLOCK,h);document.getElementById('gate').hidden=true;gateDone=true;
    markDirty();status('Password created. Hit Save & publish to lock it in.','warn');
  }
});
function markDirty(){dirty=true;status('Unsaved changes','warn');}
function src(p){return pending[p]?pending[p].dataUrl:(cache[p]||p);}
function compress(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{const max=1400,sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');
    c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);const d=c.toDataURL('image/jpeg',.85);res({dataUrl:d,b64:d.split(',')[1]});};
  img.onerror=()=>{URL.revokeObjectURL(url);rej();};img.src=url;});}
function pickImage(set){const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=async()=>{const f=inp.files[0];if(!f)return;try{const r=await compress(f);const p='images/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.jpg';pending[p]=r;set(p);markDirty();render();}
    catch(e){status('Couldn\'t read that photo. Try a JPG or PNG.','err');}};inp.click();}
function field(label,input){const w=el('label','field');w.appendChild(el('span','field-label',label));w.appendChild(input);return w;}
function text(v,on,ph){const i=el('input');i.type='text';i.value=v||'';if(ph)i.placeholder=ph;i.addEventListener('input',()=>{on(i.value);markDirty();});return i;}
function area(v,on,ph){const i=el('textarea');i.value=v||'';if(ph)i.placeholder=ph;i.addEventListener('input',()=>{on(i.value);markDirty();});return i;}
function toggle(on,set,label){const w=el('label','switch');const c=el('input');c.type='checkbox';c.checked=!!on;c.addEventListener('change',()=>{set(c.checked);markDirty();render();});w.append(c,el('span','slider'),el('span','',label));return w;}
function photo(p,set,round,pos,setPos){const outer=el('div');const w=el('div','photo');const t=el('div','thumb round');let im=null;
  if(p){im=el('img');im.src=src(p);im.alt='';im.style.objectPosition='center '+posOf(pos)+'%';t.appendChild(im);}else t.textContent='No photo';
  const b=el('button','btn small',p?'Change photo':'Add photo');b.type='button';b.onclick=()=>pickImage(set);w.append(t,b);
  if(p){const r=el('button','btn small ghost','Remove');r.type='button';r.onclick=()=>{set('');markDirty();render();};w.append(r);}
  outer.appendChild(w);
  if(p&&setPos){const sl=el('label','slide');sl.appendChild(el('span','field-label','Slide until your face sits right in the circle'));
    const row=el('div','slide-row');const r=el('input');r.type='range';r.min=0;r.max=100;r.value=posOf(pos);r.setAttribute('aria-label','Move photo up or down');
    r.addEventListener('input',()=>{const v=Number(r.value);setPos(v);im.style.objectPosition='center '+v+'%';markDirty();});
    row.append(el('span','slide-end','Top'),r,el('span','slide-end','Bottom'));sl.appendChild(row);outer.appendChild(sl);}
  return outer;}
function render(){
  const f=document.getElementById('form');f.innerHTML='';
  const page=el('section');page.appendChild(el('h2','','Page'));
  page.appendChild(field('Title',text(cfg.title,v=>cfg.title=v)));
  page.appendChild(field('Short line about you (optional)',area(cfg.tagline,v=>cfg.tagline=v)));
  const pr=el('div','field');pr.appendChild(el('span','field-label','Top banner promo'));
  pr.appendChild(text(cfg.promo.text,v=>cfg.promo.text=v,'e.g. 50% off customs for subscribers'));
  const pt=el('div','row');pt.style.marginTop='8px';pt.appendChild(toggle(cfg.promo.show,v=>cfg.promo.show=v,'Show promo'));pr.appendChild(pt);page.appendChild(pr);
  const pp=el('div','field');pp.appendChild(el('span','field-label','Profile photo'));pp.appendChild(photo(cfg.profilePhoto,v=>cfg.profilePhoto=v,true,cfg.profilePhotoPos,v=>cfg.profilePhotoPos=v));page.appendChild(pp);
  f.appendChild(page);
  const bs=el('section');bs.appendChild(el('h2','','Buttons'));
  bs.appendChild(el('p','help','Each button opens a pop-up with your note and big link buttons. Links left blank don\'t show.'));
  cfg.buttons.forEach((b,i)=>{
    const card=el('div','bcard'+(b.visible?'':' hidden-btn'));
    const h=el('div','bhead');const nm=el('span','name',b.label||'(untitled)');h.appendChild(nm);
    if(!b.visible)h.appendChild(el('span','badge','Hidden'));
    const up=el('button','iconbtn','↑');up.type='button';up.title='Move up';up.setAttribute('aria-label','Move up');up.disabled=i===0;up.onclick=()=>{[cfg.buttons[i-1],cfg.buttons[i]]=[cfg.buttons[i],cfg.buttons[i-1]];markDirty();render();};
    const dn=el('button','iconbtn','↓');dn.type='button';dn.title='Move down';dn.setAttribute('aria-label','Move down');dn.disabled=i===cfg.buttons.length-1;dn.onclick=()=>{[cfg.buttons[i+1],cfg.buttons[i]]=[cfg.buttons[i],cfg.buttons[i+1]];markDirty();render();};
    h.append(up,dn,toggle(b.visible,v=>b.visible=v,'Show'));card.appendChild(h);
    const body=el('div','bbody');
    body.appendChild(field('Button name',text(b.label,v=>{b.label=v;nm.textContent=v||'(untitled)';})));
    const ph=el('div','field');ph.appendChild(el('span','field-label','Photo (shows on the button, and as a circle when it pops up)'));ph.appendChild(photo(b.photo,v=>b.photo=v,true,b.photoPos,v=>b.photoPos=v));body.appendChild(ph);
    body.appendChild(field('Pop-up note (optional)',area(b.note,v=>b.note=v,HINTS[b.id]||'Shown at the top of the pop-up')));
    const lw=el('div','field');lw.appendChild(el('span','field-label','Links in the pop-up'));
    b.links.forEach((l,j)=>{const r=el('div','link-row');const a=text(l.label,v=>l.label=v,'Button text');const u=text(l.url,v=>l.url=v,'https://…');u.classList.add('url');
      const x=el('button','iconbtn','✕');x.type='button';x.setAttribute('aria-label','Remove link');x.onclick=()=>{b.links.splice(j,1);markDirty();render();};r.append(a,u,x);lw.appendChild(r);});
    const al=el('button','btn small ghost','+ Add link');al.type='button';al.onclick=()=>{b.links.push({label:'',url:''});markDirty();render();};lw.appendChild(al);body.appendChild(lw);
    const del=el('button','btn small danger','Delete button');del.type='button';del.onclick=()=>{if(confirm('Delete "'+(b.label||'this button')+'"?')){cfg.buttons.splice(i,1);markDirty();render();}};body.appendChild(del);
    card.appendChild(body);bs.appendChild(card);
  });
  const add=el('button','btn ghost','+ Add button');add.type='button';add.onclick=()=>{cfg.buttons.push({id:'btn'+Date.now(),label:'New button',photo:'',note:'',visible:true,links:[{label:'',url:''}]});markDirty();render();};
  bs.appendChild(add);f.appendChild(bs);
  if(cfg.live){const lv=cfg.live,nt=cfg.night||(cfg.night={show:true,start:'21:00',end:'06:00'});const ls=el('section');ls.appendChild(el('h2','','Live & bedtime (top banner)'));
    ls.appendChild(el('p','help','When you\'re live, the banner shows you on a tripod with a LIVE badge, plus a "LIVE on TikTok now" button. At bedtime you head into the van. Times are Eastern.'));
    const dl=el('span','field-label','Live days');ls.appendChild(dl);const dr=el('div','days');
    ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach((n,i)=>{const lb=el('label','day');const c=el('input');c.type='checkbox';c.checked=lv.days.includes(i);
      c.addEventListener('change',()=>{lv.days=lv.days.filter(d=>d!==i);if(c.checked)lv.days.push(i);lv.days.sort();markDirty();});lb.append(c,el('span',null,n));dr.appendChild(lb);});
    ls.appendChild(dr);
    function tm(label,obj,key){const i=el('input');i.type='time';i.value=obj[key];i.addEventListener('input',()=>{obj[key]=i.value;markDirty();});return field(label,i);}
    const hrs=el('input');hrs.type='number';hrs.min=.5;hrs.step=.5;hrs.value=lv.hours;hrs.addEventListener('input',()=>{lv.hours=Number(hrs.value)||2;markDirty();});
    const g2=el('div','grid3');g2.append(tm('Starts at',lv,'start'),field('How long (hours)',hrs));ls.appendChild(g2);
    ls.appendChild(field('Live link (leave blank to use your TikTok button link)',text(lv.url,v=>lv.url=v,'https://www.tiktok.com/@…/live')));
    ls.appendChild(toggle(lv.show,v=>lv.show=v,'Show me live on schedule'));
    const g3=el('div','grid3');g3.style.marginTop='16px';g3.append(tm('Bedtime',nt,'start'),tm('Wake up',nt,'end'));ls.appendChild(g3);
    ls.appendChild(toggle(nt.show,v=>nt.show=v,'Head into the van at night'));
    f.appendChild(ls);}
  if(cfg.ofPromo){const pr=cfg.ofPromo;const ps=el('section');ps.appendChild(el('h2','','OnlyFans promotion'));
    ps.appendChild(el('p','help','Set your promo up on OnlyFans first, then copy the same settings here. It shows in your OnlyFans pop-up with a countdown, and disappears by itself when it expires.'));
    function sel(label,opts,val,on){const s=el('select');opts.forEach(([v,tx])=>{const o=el('option',null,tx);o.value=v;if(String(v)===String(val))o.selected=true;s.appendChild(o);});s.addEventListener('change',()=>{on(s.value);markDirty();render();});return field(label,s);}
    ps.appendChild(sel('Promo type',[['trial','Free trial'],['discount','First month discount']],pr.type,v=>pr.type=v));
    if(pr.type==='trial')ps.appendChild(sel('Free trial length',Array.from({length:30},(_,i)=>[i+1,(i+1)+' day'+(i?'s':'')]),pr.trialDays,v=>pr.trialDays=Number(v)));
    else ps.appendChild(sel('Discount',Array.from({length:16},(_,i)=>[(i+1)*5,(i+1)*5+'% off']),pr.discount,v=>pr.discount=Number(v)));
    const sp=el('input');sp.type='number';sp.min=0;sp.inputMode='numeric';sp.value=pr.spots;sp.placeholder='Leave blank for no limit';
    sp.addEventListener('input',()=>{pr.spots=sp.value===''?'':Number(sp.value);markDirty();});ps.appendChild(field('How many subscribers can claim it',sp));
    const ex=[[0,'No expiration']].concat(Array.from({length:30},(_,i)=>[i+1,(i+1)+' day'+(i?'s':'')]));
    ps.appendChild(sel('Offer expires in',ex,pr.expireDays,v=>{pr.expireDays=Number(v);pr.expiresAt=pr.expireDays?Date.now()+pr.expireDays*864e5:0;}));
    const info=el('p','meter-preview');
    if(pr.expiresAt){const d=new Date(pr.expiresAt);info.textContent=(Date.now()>=pr.expiresAt?'Expired ':'Ends ')+d.toLocaleString([], {weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}
    else info.textContent=pr.expireDays?'Pick the expiration again to start the countdown':'No end date';
    ps.appendChild(info);
    const rs=el('button','btn small ghost','Restart countdown from now');rs.type='button';rs.style.marginBottom='14px';
    rs.onclick=()=>{if(!pr.expireDays){status('Pick how many days first.','warn');return;}pr.expiresAt=Date.now()+pr.expireDays*864e5;markDirty();render();};
    if(pr.expireDays)ps.appendChild(rs);
    const tg=el('div');tg.appendChild(toggle(pr.show,v=>{pr.show=v;if(v&&pr.expireDays&&(!pr.expiresAt||Date.now()>=pr.expiresAt))pr.expiresAt=Date.now()+pr.expireDays*864e5;},'Show promo'));ps.appendChild(tg);
    f.appendChild(ps);}
  if(cfg.meter){const m=cfg.meter;const ms=el('section');ms.appendChild(el('h2','','Subscriber price meter'));
    ms.appendChild(el('p','help','Shows in your OnlyFans pop-up. Type in your total subscribers and the price and progress work themselves out.'));
    const prev=el('p','meter-preview');
    function upd(){const subs=Math.max(0,Math.floor(Number(m.subs)||0)),step=Math.max(1,Math.floor(Number(m.step)||50)),start=Number(m.startPrice)||15,low=Number(m.floorPrice)||0;
      let price=start-Math.floor(subs/step);if(price<low)price=low;
      prev.textContent=price-1<low?'Right now: $'+price+'/mo (your lowest price)':'Right now: $'+price+'/mo · '+(subs%step)+' of '+step+' to drop to $'+(price-1);}
    function num(label,key,ph){const i=el('input');i.type='number';i.inputMode='numeric';i.min=0;i.value=m[key];if(ph)i.placeholder=ph;i.addEventListener('input',()=>{m[key]=i.value===''?'':Number(i.value);upd();markDirty();});return field(label,i);}
    const big=num('Total subscribers right now','subs');big.classList.add('big-num');ms.appendChild(big);
    const g=el('div','grid3');g.append(num('Starting price ($)','startPrice'),num('Subscribers per $1 off','step'),num('Lowest price ($)','floorPrice'));ms.appendChild(g);
    ms.appendChild(prev);upd();
    ms.appendChild(toggle(m.show,v=>m.show=v,'Show meter'));f.appendChild(ms);}
  const cs=el('section');cs.appendChild(el('h2','','"Get a page like this" link'));
  cs.appendChild(el('p','help','A small line at the bottom of your page so people can buy a hub like yours. It only shows when it\'s switched on and has a link.'));
  cs.appendChild(field('Text',text(cfg.credit.text,v=>cfg.credit.text=v)));
  cs.appendChild(field('Link (e.g. your Gumroad page)',text(cfg.credit.url,v=>cfg.credit.url=v,'https://…')));
  cs.appendChild(toggle(cfg.credit.show,v=>cfg.credit.show=v,'Show on my page'));f.appendChild(cs);
  const sec=el('section');sec.appendChild(el('h2','','Admin password'));
  sec.appendChild(el('p','help','Change the password you type on the Admin Portal button.'));
  const np=el('input');np.type='password';np.autocomplete='new-password';np.placeholder='New password';
  const cb=el('button','btn small','Change password');cb.type='button';
  cb.onclick=()=>{if(np.value.length<4){status('Use at least 4 characters for the password.','err');return;}
    const h=hashPw(np.value);cfg.adminPasswordHash=h;sSet(UNLOCK,h);np.value='';markDirty();status('New password set. Hit Save & publish to lock it in.','warn');};
  const r=el('div','row');np.style.flex='1';np.style.minWidth='180px';r.append(np,cb);sec.appendChild(r);f.appendChild(sec);
}
async function save(){
  if(!gh.token){document.getElementById('setup').open=true;status('Add your GitHub key first (top of page).','warn');return;}
  const btn=document.getElementById('saveBtn');btn.disabled=true;status('Saving…');
  try{
    const used=new Set([cfg.profilePhoto].concat(cfg.buttons.map(b=>b.photo)));
    for(const p of Object.keys(pending)){
      if(!used.has(p)){delete pending[p];continue;}
      status('Uploading photos…');
      const r=await api(p,{method:'PUT',body:JSON.stringify({message:'Upload photo',content:pending[p].b64,branch:gh.branch})});
      if(!r.ok)throw new Error(await errText(r));cache[p]=pending[p].dataUrl;delete pending[p];
    }
    let sha=null;const cur=await api('config.json');
    if(cur.ok)sha=(await cur.json()).sha;else if(cur.status!==404)throw new Error(await errText(cur));
    const body={message:'Update hub settings',content:enc(JSON.stringify(cfg,null,2)),branch:gh.branch};if(sha)body.sha=sha;
    const r=await api('config.json',{method:'PUT',body:JSON.stringify(body)});if(!r.ok)throw new Error(await errText(r));
    dirty=false;status('Saved! Your site updates in about a minute.','ok');
  }catch(e){status('Save failed: '+e.message,'err');}
  finally{btn.disabled=false;}
}
document.getElementById('ghOwner').value=gh.owner;document.getElementById('ghRepo').value=gh.repo;document.getElementById('ghBranch').value=gh.branch;document.getElementById('ghToken').value=gh.token;
document.getElementById('connect').onclick=async()=>{gh={owner:document.getElementById('ghOwner').value.trim(),repo:document.getElementById('ghRepo').value.trim(),branch:document.getElementById('ghBranch').value.trim()||'main',token:document.getElementById('ghToken').value.trim()};
  try{localStorage.setItem(KEY,JSON.stringify(gh));}catch(e){}document.getElementById('setup').open=false;
  const keep=cfg&&cfg.adminPasswordHash;await load();if(keep&&!cfg.adminPasswordHash){cfg.adminPasswordHash=keep;markDirty();}};
document.getElementById('forget').onclick=()=>{try{localStorage.removeItem(KEY);}catch(e){}gh.token='';document.getElementById('ghToken').value='';status('Key removed from this browser.','warn');};
document.getElementById('lockBtn').onclick=()=>{try{sessionStorage.removeItem(UNLOCK);}catch(e){}gateDone=false;closeAdmin();};
document.getElementById('saveBtn').onclick=save;
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});

let loaded=false;
function closeAdmin(){
  const a=document.getElementById('adminApp');a.hidden=true;document.body.classList.remove('admin-open');
  if(location.hash==='#admin')history.replaceState(null,'',location.pathname+location.search);
  if(cfg){const v=clone(cfg);if(v.profilePhoto)v.profilePhoto=src(v.profilePhoto);v.buttons.forEach(b=>{if(b.photo)b.photo=src(b.photo);});window.render(v);}
  const l=document.getElementById('adminLink');if(l)l.focus();
}
window.openAdmin=async function(){
  const a=document.getElementById('adminApp');a.hidden=false;a.scrollTop=0;document.body.classList.add('admin-open');
  if(!loaded){loaded=true;await load();}else await gate();
};
document.getElementById('closeAdmin').onclick=closeAdmin;
if(location.hash==='#admin')window.openAdmin();

})();
</script>
